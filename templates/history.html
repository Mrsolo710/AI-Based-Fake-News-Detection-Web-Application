<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verification History - NewsVerify AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4 md:p-8">

    <div class="max-w-3xl mx-auto space-y-6">
        
        <!-- Header & Hamburger Menu Nav -->
        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 flex justify-between items-center relative">
            <div>
                <h1 class="text-3xl font-extrabold text-blue-600">Verification History</h1>
                <p class="text-sm text-gray-500 font-medium mt-1">Review past fact-checks and analyzed sources</p>
            </div>
            
            <!-- Hamburger Menu Button -->
            <div class="relative">
                <button onclick="toggleMenu()" class="p-2.5 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-lg transition-colors focus:outline-none flex items-center justify-center">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                    </svg>
                </button>

                <!-- Dropdown Menu -->
                <div id="dropdownMenu" class="hidden absolute right-0 mt-2 w-48 bg-white border border-gray-200 rounded-xl shadow-lg py-2 z-50">
                    <a href="/" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 font-semibold transition-colors">
                        🏠 Back to Verifier
                    </a>
                </div>
            </div>
        </div>

        <!-- History List Container -->
        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
            <h2 class="text-lg font-bold text-gray-700 mb-4">Past Verifications</h2>
            <div id="historyList" class="space-y-3">
                <p class="text-sm text-gray-500 italic">Loading history...</p>
            </div>
        </div>
    </div>

    <!-- Modal for Detailed View -->
    <div id="detailModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl max-w-2xl w-full max-h-[90vh] overflow-y-auto p-6 space-y-6 shadow-2xl relative">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-700 font-bold text-xl">&times;</button>
            
            <div class="flex justify-between items-center border-b pb-4">
                <div>
                    <span class="text-xs font-bold uppercase tracking-wider text-gray-400">Assessment</span>
                    <h2 id="modalAssessment" class="text-2xl font-black mt-1"></h2>
                </div>
                <div class="text-right">
                    <span class="text-xs font-bold uppercase tracking-wider text-gray-400">Confidence</span>
                    <p id="modalConfidence" class="text-2xl font-bold text-gray-800 mt-1"></p>
                </div>
            </div>

            <div>
                <h3 class="text-xs font-bold uppercase tracking-wider text-gray-500 mb-2">Input Analyzed</h3>
                <p id="modalClaim" class="text-gray-700 font-mono text-sm bg-gray-50 p-4 rounded-lg border border-gray-200 whitespace-pre-wrap"></p>
            </div>

            <div>
                <h3 class="font-bold text-gray-700 mb-2">AI Analysis</h3>
                <p id="modalSummary" class="text-gray-800 font-medium mb-3"></p>
                <p id="modalExplanation" class="text-gray-600 text-sm leading-relaxed"></p>
            </div>

            <div>
                <h3 class="font-bold text-gray-700 mb-3">Sources Analyzed</h3>
                <div id="modalSources" class="space-y-2"></div>
            </div>
        </div>
    </div>

    <script>
        // Toggle hamburger dropdown menu
        function toggleMenu() {
            const menu = document.getElementById('dropdownMenu');
            menu.classList.toggle('hidden');
        }

        // Close dropdown when clicking outside
        window.addEventListener('click', function(e) {
            const menu = document.getElementById('dropdownMenu');
            const button = menu.previousElementSibling;
            if (!menu.contains(e.target) && !button.contains(e.target)) {
                menu.classList.add('hidden');
            }
        });

        async function fetchHistory() {
            try {
                const response = await fetch('/api/history');
                const history = await response.json();
                const container = document.getElementById('historyList');

                container.innerHTML = '';

                if (history.length === 0) {
                    container.innerHTML = '<p class="text-sm text-gray-500 italic">No past verifications found.</p>';
                    return;
                }

                history.forEach(item => {
                    let badgeColor = "bg-gray-100 text-gray-700";
                    if (item.assessment === 'LIKELY_TRUE') badgeColor = "bg-green-100 text-green-700";
                    else if (item.assessment === 'LIKELY_FALSE') badgeColor = "bg-red-100 text-red-700";
                    else if (item.assessment === 'MISLEADING') badgeColor = "bg-yellow-100 text-yellow-700";

                    const card = document.createElement('div');
                    card.className = "flex flex-col md:flex-row justify-between items-start md:items-center p-4 bg-gray-50 hover:bg-gray-100 rounded-lg border border-gray-200 gap-3 transition-all";
                    
                    card.innerHTML = `
                        <div class="flex-1 overflow-hidden">
                            <span class="inline-block px-2.5 py-1 rounded text-xs font-bold mb-1 ${badgeColor}">${item.assessment}</span>
                            <p class="text-sm font-medium text-gray-800 truncate">${item.claim}</p>
                        </div>
                        <div class="flex items-center gap-2 w-full md:w-auto justify-end">
                            <button onclick="viewDetails(${item.id})" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold px-3 py-2 rounded transition-colors">View Details</button>
                            <button onclick="deleteItem(${item.id}, event)" class="bg-red-100 hover:bg-red-200 text-red-600 text-xs font-bold px-3 py-2 rounded transition-colors">Delete</button>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (err) {
                console.error("Failed to load history:", err);
            }
        }

        async function viewDetails(id) {
            try {
                const response = await fetch(`/api/history/${id}`);
                const data = await response.json();

                if (!response.ok) throw new Error("Could not load details");

                const assessmentEl = document.getElementById('modalAssessment');
                assessmentEl.innerText = data.assessment;
                if (data.assessment === 'LIKELY_TRUE') assessmentEl.className = "text-2xl font-black mt-1 text-green-600";
                else if (data.assessment === 'LIKELY_FALSE') assessmentEl.className = "text-2xl font-black mt-1 text-red-600";
                else if (data.assessment === 'MISLEADING') assessmentEl.className = "text-2xl font-black mt-1 text-yellow-600";
                else assessmentEl.className = "text-2xl font-black mt-1 text-gray-600";

                document.getElementById('modalConfidence').innerText = data.confidence + '%';
                document.getElementById('modalClaim').innerText = data.claim;
                document.getElementById('modalSummary').innerText = data.summary;
                document.getElementById('modalExplanation').innerText = data.explanation;

                const sourcesContainer = document.getElementById('modalSources');
                sourcesContainer.innerHTML = '';

                if (data.sources && data.sources.length > 0) {
                    data.sources.forEach(src => {
                        let stanceBadge = `<span class="bg-gray-100 text-gray-700 text-xs font-bold px-2 py-1 rounded">${src.stance}</span>`;
                        if (src.stance === 'SUPPORTS') stanceBadge = `<span class="bg-green-100 text-green-700 text-xs font-bold px-2 py-1 rounded">SUPPORTS</span>`;
                        else if (src.stance === 'CONTRADICTS') stanceBadge = `<span class="bg-red-100 text-red-700 text-xs font-bold px-2 py-1 rounded">CONTRADICTS</span>`;

                        sourcesContainer.innerHTML += `
                            <div class="flex items-start gap-3 p-3 bg-gray-50 rounded-lg border border-gray-200 text-sm">
                                <div>${stanceBadge}</div>
                                <div class="overflow-hidden">
                                    <a href="${src.url}" target="_blank" class="font-semibold text-blue-600 hover:underline block truncate">${src.title || src.domain}</a>
                                    <span class="text-xs text-gray-500">${src.domain}</span>
                                </div>
                            </div>
                        `;
                    });
                } else {
                    sourcesContainer.innerHTML = '<p class="text-sm text-gray-500 italic">No sources recorded for this item.</p>';
                }

                document.getElementById('detailModal').classList.remove('hidden');
            } catch (err) {
                alert("Error loading history details: " + err.message);
            }
        }

        function closeModal() {
            document.getElementById('detailModal').classList.add('hidden');
        }

        async function deleteItem(id, event) {
            event.stopPropagation();
            if (!confirm("Are you sure you want to delete this item from history?")) return;

            try {
                const response = await fetch(`/api/history/${id}`, { method: 'DELETE' });
                if (response.ok) {
                    fetchHistory();
                } else {
                    alert("Failed to delete item.");
                }
            } catch (err) {
                alert("Error: " + err.message);
            }
        }

        fetchHistory();
    </script>
</body>
</html>
